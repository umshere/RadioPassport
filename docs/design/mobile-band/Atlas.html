<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Board frame. The design itself begins below this rule. */
html { background: #0C0B09; }
body { display: flex; justify-content: center; padding: 32px 16px; }
@media (max-width: 700px) { body { padding: 0; } }
:root{
  --ink:#0C0B09; --leather:#1A1410; --hide:#241C16;
  --bone:#E8DFD0; --dust:#9A8F80; --lacquer:#C73A3A; --foil:#C6A56A; --ether:#7EB8B4;
  --rule:rgba(232,223,208,0.10); --rule-2:rgba(232,223,208,0.18);
  --foil-line:rgba(198,165,106,.45); --foil-wash:rgba(198,165,106,.06);
  --dawn:#E3B76B; --midday:#EFE3CE; --dusk:#E07840; --night:#A79BEC;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);
  font-family:"Schibsted Grotesk","Sora",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--foil);text-decoration:none}
a:hover{color:var(--bone)}
.mono{font-family:"Azeret Mono","IBM Plex Mono",ui-monospace,monospace;font-size:10px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;line-height:1.35;margin:0}
.serif{font-family:"Newsreader","Iowan Old Style","Palatino Linotype",serif;font-style:italic;font-weight:400;margin:0}
.phone{position:relative;display:flex;flex-direction:column;width:390px;height:844px;overflow:hidden;background:var(--ink)}
.bar{display:flex;flex:none;align-items:center;justify-content:space-between;gap:12px;
  height:52px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--ink)}
.mark{display:flex;align-items:center;gap:9px}
.mark-lines{display:flex;flex-direction:column;gap:1px}
.mark-kicker{font-family:"Azeret Mono",monospace;font-size:8px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--foil)}
.mark-name{font-family:"Newsreader",serif;font-style:italic;font-size:19px;line-height:1;color:var(--bone)}
.passport{display:inline-flex;align-items:center;height:36px;padding:0 12px;border:1px solid var(--foil-line);
  background:transparent;color:var(--bone);font-family:"Azeret Mono",monospace;font-size:10px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase}
.passport b{color:var(--foil);margin-left:7px}
.body{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;overflow:hidden}
.band{flex:none;border-top:1px solid var(--rule-2);background:rgba(26,20,16,.94)}
.dock{display:flex;align-items:center;gap:12px;height:64px;padding:0 10px}
.dock-art{display:grid;flex:none;width:44px;height:44px;place-items:center;overflow:hidden;
  border:1px solid rgba(198,165,106,.28);background:#0C0B09}
.dock-copy{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
.dock-title{overflow:hidden;font-size:14px;font-weight:500;text-overflow:ellipsis;white-space:nowrap;color:var(--bone)}
.dock-play{display:grid;flex:none;width:48px;height:48px;place-items:center;border:1.5px solid var(--foil);
  border-radius:50%;background:var(--lacquer);color:var(--bone)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);height:44px;border-top:1px solid var(--rule)}
.nav a{display:grid;place-items:center;height:100%;font-family:"Azeret Mono",monospace;font-size:9px;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.nav a[aria-current="page"]{color:var(--foil);box-shadow:inset 0 -1px 0 var(--foil)}
.nav a.off{color:rgba(154,143,128,.4)}
.head{flex:none;padding:16px 16px 0}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.trail button{border:0;background:none;padding:2px 0;color:var(--dust);
  font-family:"Azeret Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
.trail button[aria-current="true"]{color:var(--foil)}
.trail span{color:var(--dust);font-family:"Azeret Mono",monospace;font-size:11px}
.sky{position:relative;flex:none;height:198px;margin-top:12px;overflow:hidden}
.pin{position:absolute;display:flex;align-items:center;gap:6px;
  font-family:"Azeret Mono",monospace;font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.pin i{display:block;width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.list{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;margin-top:6px;padding:0 16px}
.list .mono{color:var(--dust)}
.node{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:52px;
  border:0;border-bottom:1px solid var(--rule);background:none;padding:8px 0;text-align:left;color:var(--bone)}
.node:first-of-type{border-top:1px solid var(--rule)}
.node-label{font-size:15px;line-height:1.35}
.node[data-kind="country"] .node-label{font-family:"Azeret Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase}
.node-kind{flex:none;color:var(--dust)}
.node-count{flex:none;color:var(--dust);font-family:"Azeret Mono",monospace;font-size:10px;letter-spacing:.12em}
.dock-ctl{display:grid;flex:none;width:44px;height:44px;place-items:center;border:0;background:transparent;color:var(--dust)}
</style>
</head>
<body>
<div class="phone">

  <header class="bar">
    <span class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="0.5" y="0.5" width="29" height="29" rx="2" fill="none" stroke="#C6A56A" stroke-opacity="0.55"></rect>
        <circle cx="15" cy="15" r="8" fill="none" stroke="#C6A56A" stroke-opacity="0.5"></circle>
        <circle cx="15" cy="15" r="4.5" fill="#C73A3A"></circle>
      </svg>
      <span class="mark-lines">
        <span class="mark-kicker">Live radio</span>
        <span class="mark-name">Elsewhere</span>
      </span>
    </span>
    <button type="button" class="passport">Passport <b>04</b></button>
  </header>

  <main class="body">

    <div class="head">
      <h1 class="serif" style="font-size:40px;line-height:.98;letter-spacing:-.02em">The atlas</h1>
      <div class="trail">
        <button type="button">Everywhere</button>
        <span>/</span>
        <button type="button">Europe</button>
        <span>/</span>
        <button type="button" aria-current="true">Portugal</button>
      </div>
    </div>

    <div class="sky">
      <svg width="390" height="198" viewBox="0 0 390 198" aria-hidden="true">
        <rect width="390" height="198" fill="#0C0B09"></rect>
        <g stroke="#C6A56A" stroke-opacity="0.14">
          <path d="M0 46c72 24 154 30 226 16s122-38 164-58" fill="none"></path>
          <path d="M0 112c64 32 146 44 220 30s122-40 170-70" fill="none"></path>
          <path d="M0 172c68 20 150 22 218 6s120-36 172-62" fill="none"></path>
          <path d="M96 0v198M196 0v198M296 0v198" fill="none" stroke-opacity="0.08"></path>
        </g>
      </svg>
      <span class="pin" style="left:64px;top:58px;color:var(--foil)"><i></i>Lisboa 41</span>
      <span class="pin" style="left:188px;top:36px;color:var(--ether)"><i></i>Porto 18</span>
      <span class="pin" style="left:120px;top:126px;color:var(--ether)"><i></i>Faro 6</span>
      <span class="pin" style="left:246px;top:104px;color:var(--foil)"><i></i>Coimbra 9</span>
    </div>

    <section class="list">
      <p class="mono">Inside Portugal &middot; 74 lands</p>
      <button type="button" class="node" data-kind="country">
        <span class="node-label">Lisboa</span>
        <span class="node-count">41 live</span>
      </button>
      <button type="button" class="node" data-kind="country">
        <span class="node-label">Porto</span>
        <span class="node-count">18 live</span>
      </button>
      <button type="button" class="node">
        <span class="node-label">Fado</span>
        <span class="node-count">12 live</span>
      </button>
      <button type="button" class="node">
        <span class="node-label">Português</span>
        <span class="node-count">74 live</span>
      </button>
      <button type="button" class="node">
        <span class="node-label">Late night</span>
        <span class="node-count">23 live</span>
      </button>
      <button type="button" class="node">
        <span class="node-label">Coimbra</span>
        <span class="node-count">9 live</span>
      </button>
      <button type="button" class="node">
        <span class="node-label">Talk &amp; news</span>
        <span class="node-count">15 live</span>
      </button>
    </section>

  </main>

  <div class="band">
    <div class="dock">
      <span class="dock-art">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C6A56A" stroke-width="1.2">
          <circle cx="12" cy="12" r="8.5"></circle>
          <circle cx="12" cy="12" r="2.6" fill="#C73A3A" stroke="none"></circle>
        </svg>
      </span>
      <span class="dock-copy">
        <span class="dock-title">Rádio Amália</span>
        <span class="mono" style="color:var(--ether)">Live &middot; Lisboa</span>
      </span>
      <button type="button" class="dock-ctl" aria-label="Previous station">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 5.5v13L9 12l9-6.5Z"></path><rect x="5.5" y="5.5" width="2.4" height="13" rx="1"></rect>
          </svg>
        </button>
        <button type="button" class="dock-play" aria-label="Pause">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6.5" y="4.5" width="4" height="15" rx="1"></rect>
          <rect x="13.5" y="4.5" width="4" height="15" rx="1"></rect>
        </svg>
      </button>
        <button type="button" class="dock-ctl" aria-label="Next station">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 5.5v13L15 12 6 5.5Z"></path><rect x="16.1" y="5.5" width="2.4" height="13" rx="1"></rect>
          </svg>
        </button>
    </div>
    <nav class="nav" aria-label="Elsewhere">
      <a href="#home">Elsewhere</a>
      <a href="#atlas" aria-current="page">Atlas</a>
      <a href="#theater">Theater</a>
      <a href="#room">Room</a>
    </nav>
  </div>

</div>
</body>
</html>
